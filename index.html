<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Subtitle Maker</title>
<script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<style>
  :root{--bg:#0b0b0f;--card:#16161d;--line:#2a2a35;--text:#f5f5f7;--dim:#9a9aa6;--accent:#ffd23f;--ok:#2ecc71;--bad:#ff5a5a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  main{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 40px)}
  h1{font-size:26px;margin:0}
  .sub{color:var(--dim);margin:4px 0 18px;font-size:15px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
  label.small{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--dim)}
  input[type=password]{width:100%;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
  .hint{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.4}
  a{color:var(--accent)}
  .pick{display:block;text-align:center;background:var(--accent);color:#111;font-weight:800;font-size:19px;
    padding:20px;border-radius:16px;margin-bottom:14px;cursor:pointer}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px}
  .seg button.on{background:var(--text);color:#111;font-weight:700}
  .row{display:flex;gap:14px;flex-wrap:wrap}.row>div{flex:1;min-width:200px}
  #steps{list-style:none;margin:0;padding:0}
  #steps li{padding:6px 0;color:var(--dim);font-size:15px}
  #steps li.doing{color:var(--text);font-weight:600}
  #steps li.doing::before{content:"⏳ "} #steps li.done::before{content:"✅ "} #steps li.todo::before{content:"▫️ "}
  .bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:10px}
  .bar>div{height:100%;width:0;background:var(--accent);transition:width .2s}
  video{width:100%;max-height:70vh;background:#000;border-radius:14px;display:block}
  video::cue{font-size:110%;background:rgba(0,0,0,.7)}
  .btn{display:block;width:100%;padding:16px;border-radius:14px;border:0;font-size:17px;font-weight:700;margin-top:10px;text-align:center;text-decoration:none}
  .btn.primary{background:var(--ok);color:#04210f}
  .btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
  .btn:disabled{opacity:.5}
  .err{background:#3a1d1d;border:1px solid var(--bad);color:#ffd9d9;border-radius:12px;padding:12px;font-size:14px;line-height:1.45}
  details{margin-top:14px} summary{color:var(--dim);font-size:14px;padding:6px 0}
  #cueList{padding-left:0;list-style:none;font-size:14px;line-height:1.4}
  #cueList li{padding:6px 0;border-bottom:1px solid var(--line)}
  #cueList .t{color:var(--dim);font-size:12px} #cueList .es{color:var(--dim);font-style:italic}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Subtitle Maker</h1>
  <p class="sub">Spanish video in → English subtitles out.</p>

  <div class="card" id="keyCard">
    <label class="small" for="key">Groq API key (free)</label>
    <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="gsk_...">
    <div class="hint">Get one at <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>. Saved only on this device.</div>
  </div>
  <div id="keySaved" class="hint" hidden style="margin:-4px 0 14px">🔑 Key saved · <a href="#" id="changeKey">change</a></div>

  <label class="pick" id="pickLabel"><input type="file" id="file" accept="video/*" hidden>📁 Choose a video</label>

  <div class="card">
    <div class="row">
      <div>
        <label class="small">Subtitles</label>
        <div class="seg" id="modeSeg">
          <button data-v="en">English</button><button data-v="both">Eng + Esp</button><button data-v="es">Spanish</button>
        </div>
      </div>
      <div>
        <label class="small">Text size (saved video)</label>
        <div class="seg" id="sizeSeg">
          <button data-v="s">Small</button><button data-v="m">Medium</button><button data-v="l">Large</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card" id="progCard" hidden>
    <ul id="steps">
      <li data-s="audio">Reading the audio</li>
      <li data-s="stt">Writing down the Spanish</li>
      <li data-s="tr">Translating to English</li>
    </ul>
    <div class="bar"><div id="progBar"></div></div>
  </div>

  <div id="err" class="err" hidden></div>

  <div id="result" hidden>
    <video id="player" controls playsinline preload="metadata"></video>
    <button class="btn primary" id="exportBtn">💾 Make video with subtitles</button>
    <div class="card" id="exportCard" hidden style="margin-top:10px">
      <div id="exportText">Preparing…</div>
      <div class="bar"><div id="exportBar"></div></div>
    </div>
    <button class="btn primary" id="saveBtn" hidden>📲 Save video</button>
    <a class="btn ghost" id="openLink" hidden target="_blank">Open the finished video</a>
    <button class="btn ghost" id="srtBtn">Save subtitle file (.srt)</button>
    <details><summary>Show all subtitles</summary><ol id="cueList"></ol></details>
  </div>
</main>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const GROQ = 'https://api.groq.com/openai/v1/';

// ---------------- settings ----------------
const store = {
  get(k, d){ try { const v = localStorage.getItem('sm_' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem('sm_' + k, JSON.stringify(v)); } catch {} }
};
// reuse a key saved by the older live page, if any
let apiKey = store.get('key', '') || (() => { try { return JSON.parse(localStorage.getItem('ls_key') || '""'); } catch { return ''; } })();
let mode = store.get('mode', 'en');
let size = store.get('size', 'm');

function renderKey(){
  $('key').value = apiKey;
  $('keyCard').hidden = !!apiKey; $('keySaved').hidden = !apiKey;
}
$('key').addEventListener('change', e => { apiKey = e.target.value.trim(); store.set('key', apiKey); renderKey(); });
$('changeKey').onclick = e => { e.preventDefault(); $('keyCard').hidden = false; $('keySaved').hidden = true; $('key').focus(); };
function segInit(id, get, set){
  const el = $(id);
  const paint = () => el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === get()));
  el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; set(b.dataset.v); paint(); });
  paint();
}
segInit('modeSeg', () => mode, v => { mode = v; store.set('mode', v); if (cues.length) { attachTrack(); renderCueList(); resetExport(); } });
segInit('sizeSeg', () => size, v => { size = v; store.set('size', v); resetExport(); });
renderKey();

// ---------------- ui helpers ----------------
function showErr(msg){ $('err').textContent = msg; $('err').hidden = !msg; }
function step(name){
  const order = ['audio', 'stt', 'tr'];
  const idx = order.indexOf(name);
  document.querySelectorAll('#steps li').forEach(li => {
    const i = order.indexOf(li.dataset.s);
    li.className = name === 'done' ? 'done' : i < idx ? 'done' : i === idx ? 'doing' : 'todo';
  });
}
const prog = p => $('progBar').style.width = Math.round(Math.max(0, Math.min(1, p)) * 100) + '%';
const fmtTime = (s, sep) => {
  const ms = Math.round(s * 1000), h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60,
        sec = Math.floor(ms / 1000) % 60, r = ms % 1000, p = (n, l = 2) => String(n).padStart(l, '0');
  return p(h) + ':' + p(m) + ':' + p(sec) + sep + p(r, 3);
};
async function pool(items, n, fn){
  const out = new Array(items.length); let next = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (next < items.length) { const i = next++; out[i] = await fn(items[i], i); }
  }));
  return out;
}

// ---------------- Groq ----------------
async function groq(path, init){
  let r;
  try { r = await fetch(GROQ + path, init); }
  catch { throw new Error('No connection to Groq. Check your internet.'); }
  if (!r.ok) {
    let detail = ''; try { detail = (await r.json()).error?.message || ''; } catch {}
    if (r.status === 401) throw new Error('Your Groq API key is wrong. Tap "change" and paste it again.');
    if (r.status === 413) throw new Error('This video is too long for one go. Try a shorter one.');
    if (r.status === 429) {
      const m = /try again in (?:(\d+)h)?(?:(\d+)m)?(?:([\d.]+)s)?/i.exec(detail) || [];
      const wait = (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0) || 60;
      const e = new Error('rate-limit'); e.status = 429; e.wait = Math.ceil(wait) + 2; throw e;
    }
    const e = new Error('Groq error ' + r.status + (detail ? ': ' + detail : '')); e.status = r.status; throw e;
  }
  return r.json();
}

// ---------------- 1. audio extraction ----------------
// Demux an MP4/MOV with mp4box, feeding the file in slices.
function demux(file, pickTracks, onSamples, onChunkFed){
  return new Promise((resolve, reject) => {
    const mp4 = MP4Box.createFile();
    let info = null, failed = null;
    mp4.onError = e => { failed = e; };
    mp4.onReady = i => {
      info = i;
      try { for (const id of pickTracks(i, mp4)) mp4.setExtractionOptions(id, null, { nbSamples: 120 }); }
      catch (e) { failed = e; return; }
      mp4.start();
    };
    mp4.onSamples = (id, _u, samples) => {
      try { onSamples(id, samples, mp4); } catch (e) { failed = e; }
      mp4.releaseUsedSamples(id, samples[samples.length - 1].number + 1);
    };
    (async () => {
      const CH = 4 * 1024 * 1024;
      for (let off = 0; off < file.size; off += CH) {
        const ab = await file.slice(off, off + CH).arrayBuffer();
        ab.fileStart = off;
        mp4.appendBuffer(ab);
        if (failed) throw failed;
        if (onChunkFed) await onChunkFed(Math.min(1, (off + CH) / file.size));
      }
      mp4.flush();
      if (failed) throw failed;
      if (!info) throw new Error('not-mp4');
      resolve({ info, mp4 });
    })().catch(reject);
  });
}

function aacDescription(mp4, trackId){
  try {
    const e = mp4.getTrackById(trackId).mdia.minf.stbl.stsd.entries[0];
    return e.esds.esd.descs[0].descs[0].data;
  } catch { return undefined; }
}

// Returns [{blob, name, offset}] pieces, each small enough for Groq.
async function extractAudio(file){
  try {
    let at = null; const samples = [];
    const { mp4 } = await demux(file,
      info => { at = info.audioTracks[0]; if (!at) throw new Error('This video has no sound.'); return [at.id]; },
      (_id, ss) => { for (const s of ss) samples.push({ data: new Uint8Array(s.data), cts: s.cts / s.timescale, dur: s.duration / s.timescale }); },
      p => prog(p * 0.9));
    if (!at.codec.startsWith('mp4a')) throw new Error('not-aac');
    const desc = aacDescription(mp4, at.id);
    const pieces = []; let i = 0;
    const MAX_BYTES = 17 * 1024 * 1024, MAX_SEC = 20 * 60;
    while (i < samples.length) {
      const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), fastStart: 'in-memory', firstTimestampBehavior: 'offset',
        audio: { codec: 'aac', numberOfChannels: at.audio.channel_count, sampleRate: at.audio.sample_rate } });
      const start = samples[i].cts; let bytes = 0, first = true;
      while (i < samples.length && bytes < MAX_BYTES && samples[i].cts - start < MAX_SEC) {
        const s = samples[i++]; bytes += s.data.length;
        muxer.addAudioChunkRaw(s.data, 'key', s.cts * 1e6, s.dur * 1e6,
          first && desc ? { decoderConfig: { codec: 'mp4a.40.2', numberOfChannels: at.audio.channel_count, sampleRate: at.audio.sample_rate, description: desc } } : undefined);
        first = false;
      }
      muxer.finalize();
      pieces.push({ blob: new Blob([muxer.target.buffer], { type: 'audio/mp4' }), name: 'audio.m4a', offset: start });
    }
    prog(1);
    return pieces;
  } catch (e) {
    if (e && e.message === 'This video has no sound.') throw e;
    return extractAudioDecode(file); // webm, non-AAC, or anything mp4box can't read
  }
}

// Fallback: let the browser decode the audio, then make 16 kHz WAV pieces.
async function extractAudioDecode(file){
  const ab = await file.arrayBuffer();
  const ctx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 16000, 16000);
  let buf;
  try { buf = await ctx.decodeAudioData(ab); }
  catch { throw new Error("Couldn't read the sound from this video. Try another file (MP4 or MOV works best)."); }
  const n = buf.length, mono = new Float32Array(n);
  for (let c = 0; c < buf.numberOfChannels; c++) { const d = buf.getChannelData(c); for (let i = 0; i < n; i++) mono[i] += d[i] / buf.numberOfChannels; }
  const rate = buf.sampleRate, per = rate * 60 * 9, pieces = [];
  for (let s = 0; s < n; s += per) pieces.push({ blob: wav(mono.subarray(s, Math.min(n, s + per)), rate), name: 'audio.wav', offset: s / rate });
  prog(1);
  return pieces;
}
function wav(samples, rate){
  const b = new ArrayBuffer(44 + samples.length * 2), v = new DataView(b);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, samples.length * 2, true);
  for (let i = 0, o = 44; i < samples.length; i++, o += 2) { const s = Math.max(-1, Math.min(1, samples[i])); v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return new Blob([b], { type: 'audio/wav' });
}

// ---------------- 2. speech → timed Spanish lines ----------------
const JUNK = [/^[\s.,!?¡¿…-]*$/, /amara\.org/i, /suscr[ií]b/i, /subt[ií]tul/i, /thank(s| you) for watching/i, /gracias por ver/i];
const isJunk = t => JUNK.some(r => r.test(t));

// Each Whisper model has its own free hourly allowance, so fall back to turbo when large-v3 is used up.
async function transcribe(piece){
  const call = model => {
    const fd = new FormData();
    fd.append('file', piece.blob, piece.name);
    fd.append('model', model);
    fd.append('language', 'es');
    fd.append('response_format', 'verbose_json');
    fd.append('timestamp_granularities[]', 'word');
    fd.append('timestamp_granularities[]', 'segment');
    fd.append('temperature', '0');
    return groq('audio/transcriptions', { method: 'POST', headers: { Authorization: 'Bearer ' + apiKey }, body: fd });
  };
  let j;
  try { j = await call('whisper-large-v3'); }
  catch (e) {
    if (e.status !== 429) throw e;
    try { j = await call('whisper-large-v3-turbo'); }
    catch (e2) { if (e2.status === 429) e2.wait = Math.min(e.wait, e2.wait); throw e2; }
  }
  return { j, offset: piece.offset };
}

// Wait out a rate limit with a visible countdown, then let the caller retry.
async function waitForLimit(sec){
  const end = Date.now() + sec * 1000;
  while (Date.now() < end) {
    const left = Math.ceil((end - Date.now()) / 1000);
    showErr('Groq\'s free hourly limit is used up. Continuing automatically in ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') + '. Keep this page open.');
    await new Promise(r => setTimeout(r, 1000));
  }
  showErr('');
}
async function withRetry(fn){
  for (;;) {
    try { return await fn(); }
    catch (e) { if (e.status !== 429) throw e; await waitForLimit(e.wait); }
  }
}

// Remember finished subtitles per video, so re-opening the same video costs nothing.
const fileSig = f => 'sm_cues_' + f.name + '|' + f.size + '|' + f.lastModified;
function loadCached(f){ try { return JSON.parse(localStorage.getItem(fileSig(f)) || 'null'); } catch { return null; } }
function saveCached(f, c){
  try { localStorage.setItem(fileSig(f), JSON.stringify(c)); }
  catch { try { Object.keys(localStorage).filter(k => k.startsWith('sm_cues_')).forEach(k => localStorage.removeItem(k)); localStorage.setItem(fileSig(f), JSON.stringify(c)); } catch {} }
}
const pieceCache = new Map(); // sig#index -> transcription, survives a retry in the same session

function buildCues({ j, offset }){
  const all = j.segments || [];
  const keep = s => { const t = (s.text || '').trim(); return t && !isJunk(t) && !(s.no_speech_prob > 0.6 && s.avg_logprob < -0.7); };
  // give every word to the segment it starts in (word end times can run past the segment end)
  const bySeg = all.map(() => []);
  let si = 0;
  for (const w of (j.words || [])) {
    if (!(w.word || '').trim() || !all.length) continue;
    while (si < all.length - 1 && w.start >= all[si + 1].start - 0.05) si++;
    bySeg[si].push(w);
  }
  const cues = [];
  for (let k = 0; k < all.length; k++) {
    const s = all[k];
    if (!keep(s)) continue;
    const ws = bySeg[k];
    if (!ws.length) { cues.push({ start: s.start + offset, end: s.end + offset, es: s.text.trim() }); continue; }
    let cur = [];
    const flush = () => {
      if (!cur.length) return;
      cues.push({ start: cur[0].start + offset, end: cur[cur.length - 1].end + offset, es: cur.map(w => w.word.trim()).join(' ') });
      cur = [];
    };
    ws.forEach((w, i) => {
      cur.push(w);
      const text = cur.map(x => x.word.trim()).join(' ');
      const nxt = ws[i + 1];
      const gap = nxt ? nxt.start - w.end : 0;
      const dur = w.end - cur[0].start;
      if (!nxt) return;
      if (text.length > 80 || dur > 6 || gap > 1.0 || (/[.?!…]$/.test(w.word.trim()) && text.length > 18)) flush();
    });
    flush();
  }
  return cues;
}

function tidyCues(input){
  input.sort((a, b) => a.start - b.start);
  // glue tiny fragments ("Hoy", "¿Están") onto their neighbour so lines read as sentences
  const tiny = c => c.es.split(/\s+/).length <= 2 && !/[.?!…]$/.test(c.es);
  const cues = [];
  for (const c of input) {
    const prev = cues[cues.length - 1];
    const shortTail = prev && c.es.split(/\s+/).length <= 2 && !/[.?!…]$/.test(prev.es);
    if (prev && (tiny(prev) || tiny(c) || shortTail) && c.start - prev.end < 1.0 && (prev.es + ' ' + c.es).length <= 90 && c.end - prev.start <= 7) {
      prev.es += ' ' + c.es; prev.end = c.end;
    } else cues.push({ ...c });
  }
  for (let i = 0; i < cues.length; i++) {
    const c = cues[i], next = cues[i + 1];
    c.end = Math.max(c.end, c.start + Math.min(1.2, 0.35 + c.es.length * 0.05)); // readable minimum
    c.end = Math.min(c.end + 0.25, next ? next.start - 0.02 : c.end + 0.25);    // linger a bit, never overlap
    if (c.end <= c.start) c.end = c.start + 0.3;
  }
  return cues;
}

// ---------------- 3. translate ----------------
async function translateBatch(lines, context){
  const body = model => JSON.stringify({
    model, reasoning_effort: 'low', temperature: 0.2, max_completion_tokens: 8000,
    response_format: { type: 'json_object' },
    messages: [
      { role: 'system', content: 'You translate Spanish video subtitles into natural, casual English. Input is JSON {"context": [...earlier lines], "lines": [...]}. Return JSON {"en": [...]} with exactly one English string per item in "lines", same order, same count. Translate each line by itself (never merge or split lines), but use neighbouring lines to get the meaning right. Keep slang natural and keep it short like subtitles. Do not translate "context".' },
      { role: 'user', content: JSON.stringify({ context, lines }) }
    ]
  });
  const run = async model => {
    const j = await groq('chat/completions', { method: 'POST', headers: { Authorization: 'Bearer ' + apiKey, 'Content-Type': 'application/json' }, body: body(model) });
    const en = JSON.parse(j.choices[0].message.content).en;
    if (!Array.isArray(en) || en.length !== lines.length) throw new Error('mismatch');
    return en.map(x => String(x ?? '').trim());
  };
  try { return await run('openai/gpt-oss-120b'); }
  catch (e) {
    if (/key is wrong/.test(e.message)) throw e;
    try { return await run('openai/gpt-oss-20b'); }
    catch (e2) {
      if (/key is wrong/.test(e2.message) || e2.status === 429) throw e2;
      if (lines.length === 1) return [lines[0]]; // give up on this one line: show Spanish
      const h = Math.ceil(lines.length / 2);
      return [...await translateBatch(lines.slice(0, h), context), ...await translateBatch(lines.slice(h), lines.slice(Math.max(0, h - 3), h))];
    }
  }
}
async function translateAll(cues){
  const B = 40, batches = [];
  for (let i = 0; i < cues.length; i += B) batches.push(i);
  let done = 0;
  await pool(batches, 3, async i => {
    const slice = cues.slice(i, i + B);
    const en = await withRetry(() => translateBatch(slice.map(c => c.es), cues.slice(Math.max(0, i - 3), i).map(c => c.es)));
    slice.forEach((c, k) => c.en = en[k]);
    prog(++done / batches.length);
  });
}

// ---------------- subtitles output ----------------
let file = null, fileUrl = null, cues = [], trackUrl = null;
const cueText = c => mode === 'es' ? c.es : mode === 'both' ? (c.en + '\n' + c.es) : c.en;

function toVtt(){
  return 'WEBVTT\n\n' + cues.map(c => fmtTime(c.start, '.') + ' --> ' + fmtTime(c.end, '.') + ' line:88%\n' + cueText(c)).join('\n\n') + '\n';
}
function toSrt(){
  return cues.map((c, i) => (i + 1) + '\n' + fmtTime(c.start, ',') + ' --> ' + fmtTime(c.end, ',') + '\n' + cueText(c)).join('\n\n') + '\n';
}
function attachTrack(){
  const v = $('player');
  v.querySelectorAll('track').forEach(t => t.remove());
  if (trackUrl) URL.revokeObjectURL(trackUrl);
  trackUrl = URL.createObjectURL(new Blob([toVtt()], { type: 'text/vtt' }));
  const t = document.createElement('track');
  t.kind = 'subtitles'; t.label = mode === 'es' ? 'Español' : 'English'; t.srclang = mode === 'es' ? 'es' : 'en';
  t.src = trackUrl; t.default = true;
  v.appendChild(t);
  const show = () => { for (const tt of v.textTracks) tt.mode = 'showing'; };
  t.addEventListener('load', show); show();
}
function renderCueList(){
  const ol = $('cueList'); ol.textContent = '';
  for (const c of cues) {
    const li = document.createElement('li');
    const t = document.createElement('div'); t.className = 't'; t.textContent = fmtTime(c.start, '.').slice(3, 8);
    const en = document.createElement('div'); en.textContent = mode === 'es' ? c.es : c.en;
    li.append(t, en);
    if (mode === 'both') { const es = document.createElement('div'); es.className = 'es'; es.textContent = c.es; li.appendChild(es); }
    ol.appendChild(li);
  }
}
function saveBlob(blob, name){
  const f = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    return navigator.share({ files: [f] }).catch(() => {});
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
const baseName = () => (file?.name || 'video').replace(/\.[^.]+$/, '');
$('srtBtn').onclick = () => saveBlob(new Blob([toSrt()], { type: 'application/x-subrip' }), baseName() + (mode === 'es' ? '.es' : '.en') + '.srt');

// ---------------- main flow ----------------
let busy = false;
$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || busy) return;
  showErr('');
  if (!apiKey) { showErr('Paste your free Groq API key at the top first.'); $('keyCard').hidden = false; return; }
  busy = true; file = f; cues = []; resetExport();
  $('pickLabel').style.opacity = .5;
  $('result').hidden = true; $('progCard').hidden = false;
  try {
    const cached = loadCached(f);
    if (cached && cached.length && cached.every(c => typeof c.en === 'string')) {
      cues = cached; step('done'); prog(1);
    } else {
      step('audio'); prog(0);
      const pieces = await extractAudio(f);
      step('stt'); prog(0.1);
      let n = 0;
      const results = await pool(pieces, 2, async (p, i) => {
        const k = fileSig(f) + '#' + i;
        if (!pieceCache.has(k)) pieceCache.set(k, await withRetry(() => transcribe(p)));
        prog(0.1 + 0.9 * (++n / pieces.length));
        return pieceCache.get(k);
      });
      cues = tidyCues(results.flatMap(buildCues));
      if (!cues.length) throw new Error("Didn't hear any speech in this video.");
      step('tr'); prog(0);
      await translateAll(cues);
      step('done'); prog(1);
      saveCached(f, cues);
    }
    if (fileUrl) URL.revokeObjectURL(fileUrl);
    fileUrl = URL.createObjectURL(f);
    $('player').src = fileUrl;
    attachTrack(); renderCueList();
    $('result').hidden = false;
    setTimeout(() => $('progCard').hidden = true, 1200);
    $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    console.error(err);
    showErr(err.message || String(err));
    $('progCard').hidden = true;
  } finally { busy = false; $('pickLabel').style.opacity = 1; }
});

// ---------------- 4. burn subtitles into a new video ----------------
let exported = null, exporting = false;
function resetExport(){
  exported = null;
  $('saveBtn').hidden = true; $('openLink').hidden = true; $('exportCard').hidden = true;
  $('exportBtn').hidden = false; $('exportBtn').disabled = false;
}
const exportProg = (p, txt) => { $('exportBar').style.width = Math.round(p * 100) + '%'; if (txt) $('exportText').textContent = txt; };

// Draws the subtitle for time t (seconds) onto a 2D canvas context.
function makePainter(W, H){
  const scale = { s: 0.042, m: 0.052, l: 0.066 }[size];
  const fs = Math.round(Math.min(W, H) * scale), fsEs = Math.round(fs * 0.78);
  const maxW = W * 0.9, cache = new Map();
  let idx = 0;
  const wrap = (ctx, text, font) => {
    ctx.font = font; const out = [];
    for (const para of text.split('\n')) {
      let line = '';
      for (const word of para.split(/\s+/)) {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width > maxW && line) { out.push(line); line = word; } else line = test;
      }
      if (line) out.push(line);
    }
    return out;
  };
  const fontEn = `700 ${fs}px -apple-system, "Helvetica Neue", Arial, sans-serif`;
  const fontEs = `italic 600 ${fsEs}px -apple-system, "Helvetica Neue", Arial, sans-serif`;
  return (ctx, t) => {
    while (idx < cues.length - 1 && cues[idx].end < t) idx++;
    while (idx > 0 && cues[idx].start > t) idx--;
    const c = cues[idx];
    if (!c || t < c.start || t > c.end) return;
    let lines = cache.get(idx);
    if (!lines) {
      lines = [];
      const main = mode === 'es' ? c.es : c.en;
      for (const l of wrap(ctx, main, fontEn)) lines.push({ l, font: fontEn, size: fs, color: '#fff' });
      if (mode === 'both') for (const l of wrap(ctx, c.es, fontEs)) lines.push({ l, font: fontEs, size: fsEs, color: '#ffe066' });
      cache.set(idx, lines);
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
    let y = H - Math.round(H * (H > W ? 0.13 : 0.07));
    for (let i = lines.length - 1; i >= 0; i--) {
      const L = lines[i];
      ctx.font = L.font; ctx.lineWidth = Math.max(3, L.size * 0.2); ctx.strokeStyle = 'rgba(0,0,0,.9)';
      ctx.strokeText(L.l, W / 2, y); ctx.fillStyle = L.color; ctx.fillText(L.l, W / 2, y);
      y -= Math.round(L.size * 1.22);
    }
  };
}

function videoDescription(mp4, trackId){
  const trak = mp4.getTrackById(trackId);
  for (const entry of trak.mdia.minf.stbl.stsd.entries) {
    const box = entry.avcC || entry.hvcC || entry.vpcC || entry.av1C;
    if (box) {
      const stream = new DataStream(undefined, 0, DataStream.BIG_ENDIAN);
      box.write(stream);
      return new Uint8Array(stream.buffer, 8);
    }
  }
}
const tick = () => new Promise(r => setTimeout(r, 1));

async function pickEncoder(W, H, fps){
  const bitrate = Math.round(Math.min(14e6, Math.max(2.5e6, W * H * fps * 0.11)));
  const codecs = W * H > 1920 * 1088 ? ['avc1.640033', 'avc1.4d0033'] : ['avc1.640028', 'avc1.4d0028', 'avc1.42002a', 'avc1.42001f'];
  for (const codec of codecs) {
    for (const hw of ['prefer-hardware', 'no-preference']) {
      const cfg = { codec, width: W, height: H, bitrate, framerate: fps, avc: { format: 'avc' }, hardwareAcceleration: hw };
      try { if ((await VideoEncoder.isConfigSupported(cfg)).supported) return cfg; } catch {}
    }
  }
  return null;
}

// Fast path: WebCodecs decode → draw subs → hardware encode, audio copied untouched.
async function exportFast(){
  if (!('VideoEncoder' in window && 'VideoDecoder' in window && 'EncodedVideoChunk' in window)) throw new Error('no-webcodecs');
  let vt = null, at = null, audioDesc, enc, dec, muxer, canvas, ctx, paint;
  let rot = 0, W, H, total = 0, doneFrames = 0, keyEvery = 60, fatal = null, ready = null, firstAudio = true;
  const pending = [], queue = [];

  async function setup(info, mp4){
    const m = vt.matrix || [65536, 0, 0, 0, 65536];
    rot = (Math.round(Math.atan2(m[1], m[0]) * 180 / Math.PI) + 360) % 360;
    const srcW = vt.video.width, srcH = vt.video.height;
    const dw = rot % 180 ? srcH : srcW, dh = rot % 180 ? srcW : srcH;
    const k = Math.min(1, 1920 / Math.max(dw, dh));
    W = Math.round(dw * k / 2) * 2; H = Math.round(dh * k / 2) * 2;
    const fps = Math.min(60, Math.max(1, Math.round(vt.nb_samples / (vt.duration / vt.timescale)) || 30));
    keyEvery = fps * 2; total = vt.nb_samples;
    const dcfg = { codec: vt.codec, codedWidth: srcW, codedHeight: srcH, description: videoDescription(mp4, vt.id) };
    if (!(await VideoDecoder.isConfigSupported(dcfg)).supported) throw new Error('no-decoder');
    const ecfg = await pickEncoder(W, H, fps);
    if (!ecfg) throw new Error('no-encoder');
    if (at) audioDesc = aacDescription(mp4, at.id);
    muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), fastStart: 'in-memory', firstTimestampBehavior: 'cross-track-offset',
      video: { codec: 'avc', width: W, height: H, frameRate: fps },
      audio: at ? { codec: 'aac', numberOfChannels: at.audio.channel_count, sampleRate: at.audio.sample_rate } : undefined });
    canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
    ctx = canvas.getContext('2d');
    paint = makePainter(W, H);
    enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => fatal = e });
    enc.configure(ecfg);
    dec = new VideoDecoder({ output: onFrame, error: e => fatal = e });
    dec.configure(dcfg);
  }

  function onFrame(frame){
    try {
      const t = frame.timestamp, dur = frame.duration;
      ctx.save();
      if (rot === 90) { ctx.translate(W, 0); ctx.rotate(Math.PI / 2); ctx.drawImage(frame, 0, 0, H, W); }
      else if (rot === 180) { ctx.translate(W, H); ctx.rotate(Math.PI); ctx.drawImage(frame, 0, 0, W, H); }
      else if (rot === 270) { ctx.translate(0, H); ctx.rotate(-Math.PI / 2); ctx.drawImage(frame, 0, 0, H, W); }
      else ctx.drawImage(frame, 0, 0, W, H);
      ctx.restore();
      frame.close();
      paint(ctx, t / 1e6);
      const vf = new VideoFrame(canvas, { timestamp: t, duration: dur || undefined });
      enc.encode(vf, { keyFrame: doneFrames % keyEvery === 0 });
      vf.close();
      doneFrames++;
      if (doneFrames % 15 === 0) exportProg(doneFrames / total, 'Adding subtitles… ' + Math.round(doneFrames / total * 100) + '%');
    } catch (e) { fatal = e; }
  }

  // move demuxed samples to the decoder queue / muxer (only once setup() is done)
  function takePending(){
    for (const s of pending.splice(0)) {
      if (s.id === vt.id) queue.push(new EncodedVideoChunk({ type: s.sync ? 'key' : 'delta', timestamp: s.ts, duration: s.dur, data: s.data }));
      else if (at && s.id === at.id) {
        muxer.addAudioChunkRaw(s.data, 'key', s.ts, s.dur, firstAudio && audioDesc
          ? { decoderConfig: { codec: 'mp4a.40.2', numberOfChannels: at.audio.channel_count, sampleRate: at.audio.sample_rate, description: audioDesc } } : undefined);
        firstAudio = false;
      }
    }
  }
  async function drain(limit){
    while (queue.length > limit) {
      if (fatal) throw fatal;
      while (dec.decodeQueueSize > 4 || enc.encodeQueueSize > 4) { await tick(); if (fatal) throw fatal; }
      dec.decode(queue.shift());
    }
  }

  await demux(file,
    (info, mp4) => {
      vt = info.videoTracks[0];
      if (!vt) throw new Error('This file has no video.');
      at = info.audioTracks[0] && info.audioTracks[0].codec.startsWith('mp4a') ? info.audioTracks[0] : null;
      ready = setup(info, mp4);
      ready.catch(() => {});
      return at ? [vt.id, at.id] : [vt.id];
    },
    (id, ss) => {
      for (const s of ss) pending.push({ id, data: new Uint8Array(s.data), sync: s.is_sync,
        ts: Math.round(s.cts * 1e6 / s.timescale), dur: Math.round(s.duration * 1e6 / s.timescale) });
    },
    async () => { if (ready) { await ready; takePending(); await drain(90); } });
  if (!ready) throw new Error('not-mp4');
  await ready; takePending();
  await drain(0);
  await dec.flush(); if (fatal) throw fatal;
  await enc.flush(); if (fatal) throw fatal;
  dec.close(); enc.close();
  muxer.finalize();
  return new Blob([muxer.target.buffer], { type: 'video/mp4' });
}

// Slow fallback: play the video once, redraw it with subtitles and record it (takes as long as the video).
async function exportRealtime(){
  const v = document.createElement('video');
  v.src = fileUrl; v.playsInline = true; v.preload = 'auto';
  await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(new Error("Couldn't open the video.")); });
  const k = Math.min(1, 1920 / Math.max(v.videoWidth, v.videoHeight));
  const W = Math.round(v.videoWidth * k / 2) * 2, H = Math.round(v.videoHeight * k / 2) * 2;
  const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d'), paint = makePainter(W, H);
  const stream = canvas.captureStream(30);
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaElementSource(v), dest = ac.createMediaStreamDestination();
    src.connect(dest); dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    await ac.resume();
  } catch {}
  const type = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!type) throw new Error("This browser can't make videos. Use the .srt file instead.");
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 8e6 });
  const parts = []; rec.ondataavailable = e => e.data.size && parts.push(e.data);
  const stopped = new Promise(r => rec.onstop = r);
  let raf;
  const draw = () => { ctx.drawImage(v, 0, 0, W, H); paint(ctx, v.currentTime); exportProg(v.currentTime / v.duration, 'Recording with subtitles… keep this screen on (' + Math.round(v.currentTime / v.duration * 100) + '%)'); raf = requestAnimationFrame(draw); };
  rec.start(1000); draw();
  await v.play();
  await new Promise(r => v.onended = r);
  cancelAnimationFrame(raf); rec.stop(); await stopped;
  return new Blob(parts, { type: type.split(';')[0] });
}

$('exportBtn').onclick = async () => {
  if (exporting || !cues.length) return;
  exporting = true; showErr('');
  $('exportBtn').disabled = true; $('exportCard').hidden = false; exportProg(0, 'Preparing…');
  let wake; try { wake = await navigator.wakeLock?.request('screen'); } catch {}
  const t0 = performance.now();
  try {
    let blob;
    try { blob = await exportFast(); }
    catch (e) {
      console.warn('fast export failed, using realtime', e);
      if (/no sound|no video/i.test(e.message)) throw e;
      exportProg(0, 'Using slower method… keep this screen on');
      blob = await exportRealtime();
    }
    exported = { blob, name: baseName() + '-subtitles.' + (blob.type.includes('webm') ? 'webm' : 'mp4') };
    exportProg(1, '✅ Done in ' + Math.round((performance.now() - t0) / 1000) + 's (' + (blob.size / 1048576).toFixed(1) + ' MB)');
    $('exportBtn').hidden = true; $('saveBtn').hidden = false;
    $('openLink').href = URL.createObjectURL(blob); $('openLink').hidden = false;
    window.__exported = exported; // used by automated tests
  } catch (e) {
    console.error(e);
    showErr("Couldn't make the video: " + (e.message || e) + '. You can still save the .srt subtitle file.');
    $('exportCard').hidden = true; $('exportBtn').disabled = false;
  } finally { exporting = false; try { wake?.release(); } catch {} }
};
$('saveBtn').onclick = () => exported && saveBlob(exported.blob, exported.name);
})();
</script>
